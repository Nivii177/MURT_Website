<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title and description (overridden per-page by react-helmet-async) -->
    <title>MAC UNDERWATER ROBOTICS TEAM</title>
    <meta name="description" content="MURT is a student engineering team at McMaster University designing and building underwater robots to compete in the MATE ROV Competition." />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.macmurt.com/" />

    <!-- WebSite structured data — tells Google the site name to show in search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "McMaster Underwater Robotics Team",
      "url": "https://www.macmurt.com/"
    }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="McMaster Underwater Robotics Team" />
    <meta property="og:title" content="McMaster Underwater Robotics Team" />
    <meta property="og:description" content="MURT is a student engineering team at McMaster University designing and building underwater robots to compete in the MATE ROV Competition." />
    <meta property="og:url" content="https://www.macmurt.com/" />
    <meta property="og:image" content="https://www.macmurt.com/murtLogo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="McMaster Underwater Robotics Team" />
    <meta name="twitter:description" content="MURT is a student engineering team at McMaster University designing and building underwater robots to compete in the MATE ROV Competition." />
    <meta name="twitter:image" content="https://www.macmurt.com/murtLogo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
